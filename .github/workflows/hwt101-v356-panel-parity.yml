name: HWT101 V3.56 Panel Parity

on:
  push:
    branches: [ v356-panel-parity ]
    paths:
      - '.github/workflows/hwt101-v356-panel-parity.yml'
      - 'scripts/patch_hwt101_v356_panel_parity.py'
      - 'scripts/patch_hwt101_v350_golden.py'
      - 'scripts/patch_hwt101_yaffs_v350.py'
      - 'scripts/reconstruct_t101_board_cm10.py'
      - 'oem_recovered/display/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -e
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*google*' -o -iname '*chrome*' \) -print -delete || true
          sudo dpkg --add-architecture i386 || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y build-essential bc git libc6-i386 lib32z1 lib32stdc++6 libspreadsheet-parseexcel-perl

      - name: Exact source and GCC
        run: |
          set -e
          git clone --depth 1 -b cm-10.1 https://github.com/mangusta86/android_kernel_huawei_k3v2oem1.git kernel
          test "$(git -C kernel rev-parse HEAD)" = "08fd9448a6bfc6923a5caa9da8260d3be930686c"
          git -C kernel rev-parse HEAD | tee V356-SOURCE-SHA.txt
          git clone --depth 1 https://github.com/radxa/android-platform-prebuilts-gcc-linux-x86-arm-arm-eabi-4.6.git gcc46
          gcc46/bin/arm-eabi-gcc --version | tee V356-GCC.txt
          grep -qi '4.6.x-google 20120106' V356-GCC.txt
          echo "TC=$PWD/gcc46/bin/arm-eabi-" >> "$GITHUB_ENV"
          sed -i -E 's/defined[[:space:]]*\([[:space:]]*\@([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*\)/@\1/g' kernel/kernel/timeconst.pl || true
          sed -i -E 's/defined[[:space:]]*\([[:space:]]*\%([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*\)/%\1/g' kernel/kernel/timeconst.pl || true

      - name: Configure FIX10 golden baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm SUBARCH=arm CROSS_COMPILE="$TC"
          make mrproper
          make hisi_k3v2oem1_defconfig
          set_y(){ sed -i "/^# CONFIG_$1 is not set/d;/^CONFIG_$1=/d" .config; echo "CONFIG_$1=y" >> .config; }
          set_n(){ sed -i "/^# CONFIG_$1 is not set/d;/^CONFIG_$1=/d" .config; echo "# CONFIG_$1 is not set" >> .config; }
          set_v(){ sed -i "/^# CONFIG_$1 is not set/d;/^CONFIG_$1=/d" .config; echo "CONFIG_$1=$2" >> .config; }
          set_y LCD_TOSHIBA_MDW70
          for x in LCD_PANASONIC_VVX10F002A00 LCD_CMI_OTM1280A LCD_SAMSUNG_LMS350DF04 LCD_SAMSUNG_S6E39A LCD_SHARP_LS035B3SX LCD_CMI_PT045TN07 LCD_JDI_OTM1282B LCD_TOSHIBA_MDY90 LCD_K3_FAKE; do set_n "$x"; done
          for x in FB_K3 FB_K3_CLCD I2C REGULATOR HAS_EARLYSUSPEND EARLYSUSPEND LEDS_K3_6421 ANDROID_K3_VIBRATOR ARM_HISIK3_WATCHDOG; do set_y "$x"; done
          for x in TOUCH_INPUT_SYNAPTICS_RMI4 TOUCHSCREEN_RMI4_SYNAPTICS_GENERIC SYNAPTICS_TOUCH_KEY SRECORDER BALONG_POWER BALONG_RMNET MHL_SII8240 MHL_SII9244 K3_LOG; do set_n "$x"; done
          set_y XMM_POWER
          set_y XMM_RMNET
          for x in MTD MTD_CHAR MTD_BLOCK MTD_PARTITIONS MTD_CMDLINE_PARTS MTD_NAND MTD_NAND_IDS MISC_FILESYSTEMS YAFFS_FS YAFFS_YAFFS2; do set_y "$x"; done
          for x in SWAP ZRAM XVMALLOC ZRAM_DEBUG; do set_n "$x"; done
          set_v PANIC_TIMEOUT 0
          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_LOCALVERSION_AUTO=/d;/^# CONFIG_LOCALVERSION_AUTO is not set/d' .config
          echo 'CONFIG_LOCALVERSION="-g883717a-dirty"' >> .config
          echo '# CONFIG_LOCALVERSION_AUTO is not set' >> .config
          rm -f .scmversion
          make oldnoconfig

      - name: Reconstruct HWT101 and patch panel parity
        run: |
          set -e
          python3 scripts/reconstruct_t101_board_cm10.py kernel | tee V356-BOARD-PATCH.txt
          grep -q 'platform=21, i2c=1/10/2' V356-BOARD-PATCH.txt
          cp oem_recovered/display/sn65dsi83_hwt101.c kernel/drivers/video/k3/sn65dsi83_hwt101.c
          cp oem_recovered/display/sn65dsi83_oem_table.h kernel/drivers/video/k3/sn65dsi83_oem_table.h
          python3 scripts/patch_hwt101_v350_golden.py kernel | tee V356-GOLDEN-PATCH.txt
          python3 scripts/patch_hwt101_yaffs_v350.py kernel | tee V356-YAFFS-PATCH.txt
          python3 scripts/patch_hwt101_v356_panel_parity.py kernel | tee V356-PANEL-PATCH.txt
          export ARCH=arm SUBARCH=arm CROSS_COMPILE="$TC"
          make -C kernel oldnoconfig
          cp kernel/.config V356-CONFIG.txt

      - name: Source hard gate
        shell: bash
        run: |
          set -euo pipefail
          P=kernel/drivers/video/k3/panel/mipi_toshiba_MDW70_V001.c
          S=kernel/drivers/video/k3/sn65dsi83_oem_table.h
          grep -q 'pinfo->xres = 1280;' "$P"
          grep -q 'pinfo->yres = 800;' "$P"
          grep -q 'pinfo->orientation = LCD_LANDSCAPE;' "$P"
          ! grep -q 'pinfo->xres = 720;' "$P"
          grep -q 'HWT356 PANEL_PARITY 1280x800 LANDSCAPE' "$P"
          grep -q '{ 0x20, 0x00 }, { 0x21, 0x05 }' "$S"
          grep -q '{ 0x24, 0x20 }, { 0x25, 0x03 }' "$S"
          ! grep -Rqs 'hwt355_screen_checkpoint\|HWT355CHK' kernel
          ! grep -Rqs 'HWTDIAG_BASE\|HWT_SOFT_TIMEOUT_SEC\|HWTDIAG3' kernel
          grep -qx '# CONFIG_SWAP is not set' kernel/.config
          grep -qx '# CONFIG_ZRAM is not set' kernel/.config
          grep -qx 'CONFIG_PANIC_TIMEOUT=0' kernel/.config
          echo V356_PANEL_PARITY_SOURCE_GATE=PASS | tee V356-GATE.txt

      - name: Build zImage
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm SUBARCH=arm CROSS_COMPILE="$TC"
          make -j2 zImage 2>&1 | tee ../V356-BUILD.log
          cp arch/arm/boot/zImage ../HWT101-V3.56-FIX10-PANEL-PARITY-zImage
          cp vmlinux ../HWT101-V3.56-PANEL-PARITY-vmlinux
          cp System.map ../HWT101-V3.56-PANEL-PARITY-System.map
          "$TC"nm -n vmlinux > ../V356-NM-ORDERED.txt
          sha256sum arch/arm/boot/zImage | tee ../V356-SHA256.txt
          stat -c%s arch/arm/boot/zImage | tee ../V356-SIZE.txt

      - name: Binary audit
        shell: bash
        run: |
          set -euo pipefail
          MAP=kernel/System.map; VM=kernel/vmlinux
          {
            echo '=== V3.56 HWT101 PANEL PARITY AUDIT ==='
            for sym in k3_fb_init mipi_toshiba_panel_init mipi_toshiba_panel_set_fastboot sn65dsi83_probe mipi_dsi_probe ldi_probe nand_scan hinand_probe; do
              grep -Eq " [tT] ${sym}$" "$MAP" || { echo "MISSING_SYMBOL=$sym"; exit 91; }
              echo "OK_SYMBOL=$sym"
            done
            grep -aFq 'HWT356 PANEL_PARITY 1280x800 LANDSCAPE' "$VM" || { echo MISSING_V356_MARKER; exit 92; }
            ! grep -aFq 'HWT355CHK' "$VM"
            grep -qx '# CONFIG_SWAP is not set' kernel/.config
            grep -qx '# CONFIG_ZRAM is not set' kernel/.config
            echo V356_BINARY=PASS
            echo PANEL=1280x800_LANDSCAPE
            echo SN65_OEM_TABLE=43_PAIRS
            echo CHECKPOINT=NONE
            echo SWAP=OFF
            echo ZRAM=OFF
          } | tee V356-FINAL-AUDIT.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HWT101-V3.56-FIX10-PANEL-PARITY
          include-hidden-files: true
          path: |
            HWT101-V3.56-FIX10-PANEL-PARITY-zImage
            HWT101-V3.56-PANEL-PARITY-vmlinux
            HWT101-V3.56-PANEL-PARITY-System.map
            V356-CONFIG.txt
            V356-SOURCE-SHA.txt
            V356-GCC.txt
            V356-BOARD-PATCH.txt
            V356-GOLDEN-PATCH.txt
            V356-YAFFS-PATCH.txt
            V356-PANEL-PATCH.txt
            V356-GATE.txt
            V356-BUILD.log
            V356-SHA256.txt
            V356-SIZE.txt
            V356-NM-ORDERED.txt
            V356-FINAL-AUDIT.txt
            kernel/drivers/video/k3/panel/mipi_toshiba_MDW70_V001.c
