name: HWT101 V4.10B FIX10 EXACT HSAD

on:
  workflow_dispatch:
  push:
    branches:
      - v410b-fix10-exact-hsad
    paths:
      - '.github/workflows/hwt101-v410b-fix10-exact-hsad.yml'
      - 'scripts/patch_hwt101_v410b_fix10_exact_hsad.py'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -e
          sudo dpkg --add-architecture i386 || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y build-essential bc git libc6-i386 lib32z1 lib32stdc++6 libspreadsheet-parseexcel-perl

      - name: Reproduce exact V4.07B and patch compiled HSAD table
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          wf = Path('.github/workflows/hwt101-v406-yaffs64-userdata.yml').read_text()

          def run_step(name):
              marker=f'      - name: {name}\n'
              p=wf.find(marker)
              if p < 0: raise SystemExit(f'missing step: {name}')
              r=wf.find('        run: |\n', p)
              if r < 0: raise SystemExit(f'missing run: {name}')
              r += len('        run: |\n')
              e=wf.find('\n      - name:', r)
              if e < 0: e=wf.find('\n      - uses:', r)
              if e < 0: raise SystemExit(f'missing end: {name}')
              lines=[]
              for line in wf[r:e].splitlines():
                  lines.append(line[10:] if line.startswith('          ') else line)
              subprocess.run('\n'.join(lines)+'\n', shell=True, executable='/bin/bash', check=True)

          run_step('Reproduce exact V4.06 baseline')
          run_step('Apply exact OEM kernelrelease and ONLY TI-ST at final build')

          pth=Path('scripts/build_hwt101_v363_ntfs_prune.sh')
          s=pth.read_text()
          anchor='python3 scripts/patch_hwt101_v406_yaffs64_userdata.py kernel | tee V406-YAFFS64-USERDATA.txt\n'
          if anchor not in s:
              raise SystemExit('V406 patch invocation anchor missing')
          s=s.replace(anchor, anchor+'python3 scripts/patch_hwt101_v410b_fix10_exact_hsad.py kernel | tee V410B-FIX10-EXACT-HSAD.txt\n',1)
          pth.write_text(s)
          print('V410B_DERIVATION=PASS')
          print('BASE=EXACT_V407B_HARDWARE_PASS')
          print('ONLY_CHANGE=FIX10_EXACT_BOARDID0_IN_COMPILED_HSAD_TABLE')
          PY

      - name: Build V4.10B
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_hwt101_v363_ntfs_prune.sh
          cp HWT101-V3.63-FIX10-NTFS-PRUNE-zImage HWT101-V4.10B-FIX10-EXACT-HSAD-zImage
          cp kernel/vmlinux HWT101-V4.10B-FIX10-EXACT-HSAD-vmlinux
          cp kernel/System.map HWT101-V4.10B-FIX10-EXACT-HSAD-System.map
          cp kernel/.config V410B-kernel-config.txt
          sha256sum HWT101-V4.10B-FIX10-EXACT-HSAD-zImage | tee V410B-SHA256.txt
          stat -c%s HWT101-V4.10B-FIX10-EXACT-HSAD-zImage | tee V410B-SIZE.txt
          make -s -C kernel ARCH=arm CROSS_COMPILE="$PWD/gcc46/bin/arm-eabi-" LOCALVERSION= kernelrelease | tail -n1 | tee V410B-KERNELRELEASE.txt

      - name: V4.10B audit source and linked binary
        shell: bash
        run: |
          set -euo pipefail
          C=kernel/.config
          M=kernel/System.map
          H=kernel/drivers/mtd/nand/hinand_hwt101.c
          Y1=kernel/fs/yaffs2/yaffs_mtdif.c
          Y2=kernel/fs/yaffs2/yaffs_mtdif2.c
          T=kernel/drivers/huawei/hsad/auto-generate/config_total_product.c
          K=kernel/drivers/huawei/hsad/auto-generate/hw_hwt101_fix10_k3oem_configs.c
          V=kernel/vmlinux

          grep -qx '3.0.8-g883717a-dirty' V410B-KERNELRELEASE.txt
          grep -qx 'CONFIG_BT=y' "$C"
          grep -qx 'CONFIG_CFG80211=y' "$C"
          grep -qx 'CONFIG_TI_ST=y' "$C"
          grep -qx '# CONFIG_ST_HCI is not set' "$C"
          grep -Eq ' [tT] st_register$' "$M"
          grep -Eq ' [tT] st_unregister$' "$M"

          grep -q 'hw_hwt101_fix10_k3oem_configs.c' "$T"
          grep -q '&config_common_hwt101_fix10_k3oem' "$T"
          grep -q '.board_id = 0x00' "$K"
          test "$(grep -c '^    {"' "$K")" -eq 21

          # These symbols MUST exist in the linked vmlinux; this catches patching the wrong file.
          readelf -s "$V" | grep -q 'hw_hwt101_fix10'
          readelf -s "$V" | grep -q 'config_common_hwt'
          # V4.07B had 44 pointers = 176 bytes. V4.10B must have 45 = 180 bytes.
          readelf -s "$V" | awk '$NF=="hw_ver_total_configs"{print $3}' | grep -qx '180'

          grep -q '#define HWT_ANDROID_FIRST_PAGE 0x16500U' "$H"
          grep -q '#define HWT_ANDROID_LAST_PAGE  0xfffffU' "$H"
          grep -q 'loff_t addr =' "$Y1"
          test "$(grep -c '((loff_t) block_no) \* dev->param.chunks_per_block \*' "$Y2")" -ge 2

          {
            echo '=== HWT101 V4.10B FIX10 EXACT HSAD AUDIT ==='
            echo BUILD=PASS
            echo BASE=V4.07B_HARDWARE_PASS
            echo PATCH_TARGET=COMPILED_AUTO_GENERATE_CONFIG_TOTAL_PRODUCT
            echo BOARDID0_LINKED_IN_VMLINUX=YES
            echo HW_VER_TOTAL_CONFIGS_POINTERS=45
            echo EXACT_FIX10_PAIR_COUNT=21
            echo PUBLIC_K3OEM_V408=NOT_USED
            echo HDMI_V409_PATCH=NOT_USED
            echo V405_WRITE_GUARD=PRESERVED
            echo V406_YAFFS64=PRESERVED
            echo TI_ST=PRESERVED
            echo KERNELRELEASE=3.0.8-g883717a-dirty
            echo "ZIMAGE_SIZE=$(cat V410B-SIZE.txt)"
            echo "ZIMAGE_SHA256=$(cut -d' ' -f1 V410B-SHA256.txt)"
          } | tee V410B-FINAL-AUDIT.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HWT101-V4.10B-FIX10-EXACT-HSAD
          include-hidden-files: true
          path: |
            HWT101-V4.10B-*
            V410B-*.txt
            V405-*.txt
            V406-*.txt
            kernel/.config
            kernel/System.map
            kernel/vmlinux
            kernel/drivers/huawei/hsad/auto-generate/config_total_product.c
            kernel/drivers/huawei/hsad/auto-generate/hw_hwt101_fix10_k3oem_configs.c
            kernel/drivers/mtd/nand/hinand_hwt101.c
            kernel/fs/yaffs2/yaffs_mtdif.c
            kernel/fs/yaffs2/yaffs_mtdif2.c
          if-no-files-found: error
