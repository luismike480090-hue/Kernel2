name: HWT101 V4.10 FIX10 EXACT K3OEM

on:
  workflow_dispatch:
  push:
    branches:
      - v410-fix10-exact-k3oem
    paths:
      - '.github/workflows/hwt101-v410-fix10-exact-k3oem.yml'
      - 'scripts/patch_hwt101_v410_fix10_exact_k3oem.py'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -e
          sudo dpkg --add-architecture i386 || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y build-essential bc git libc6-i386 lib32z1 lib32stdc++6 libspreadsheet-parseexcel-perl

      - name: Reproduce exact V4.07B and add only FIX10 boardid0 profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          wf = Path('.github/workflows/hwt101-v406-yaffs64-userdata.yml').read_text()

          def run_step(name):
              marker=f'      - name: {name}\n'
              p=wf.find(marker)
              if p < 0: raise SystemExit(f'missing step: {name}')
              r=wf.find('        run: |\n', p)
              if r < 0: raise SystemExit(f'missing run: {name}')
              r += len('        run: |\n')
              e=wf.find('\n      - name:', r)
              if e < 0: e=wf.find('\n      - uses:', r)
              if e < 0: raise SystemExit(f'missing end: {name}')
              lines=[]
              for line in wf[r:e].splitlines():
                  lines.append(line[10:] if line.startswith('          ') else line)
              subprocess.run('\n'.join(lines)+'\n', shell=True, executable='/bin/bash', check=True)

          run_step('Reproduce exact V4.06 baseline')
          run_step('Apply exact OEM kernelrelease and ONLY TI-ST at final build')

          pth=Path('scripts/build_hwt101_v363_ntfs_prune.sh')
          s=pth.read_text()
          anchor='python3 scripts/patch_hwt101_v406_yaffs64_userdata.py kernel | tee V406-YAFFS64-USERDATA.txt\n'
          if anchor not in s:
              raise SystemExit('V406 patch invocation anchor missing')
          s=s.replace(anchor, anchor+'python3 scripts/patch_hwt101_v410_fix10_exact_k3oem.py kernel | tee V410-FIX10-EXACT-K3OEM.txt\n',1)
          pth.write_text(s)

          print('V410_DERIVATION=PASS')
          print('BASE=EXACT_V407B_HARDWARE_PASS')
          print('ONLY_CHANGE=FIX10_EXACT_BOARDID0_PROFILE')
          PY

      - name: Build V4.10
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_hwt101_v363_ntfs_prune.sh
          cp HWT101-V3.63-FIX10-NTFS-PRUNE-zImage HWT101-V4.10-FIX10-EXACT-K3OEM-zImage
          cp kernel/vmlinux HWT101-V4.10-FIX10-EXACT-K3OEM-vmlinux
          cp kernel/System.map HWT101-V4.10-FIX10-EXACT-K3OEM-System.map
          cp kernel/.config V410-kernel-config.txt
          sha256sum HWT101-V4.10-FIX10-EXACT-K3OEM-zImage | tee V410-SHA256.txt
          stat -c%s HWT101-V4.10-FIX10-EXACT-K3OEM-zImage | tee V410-SIZE.txt
          make -s -C kernel ARCH=arm CROSS_COMPILE="$PWD/gcc46/bin/arm-eabi-" LOCALVERSION= kernelrelease | tail -n1 | tee V410-KERNELRELEASE.txt

      - name: V4.10 audit
        shell: bash
        run: |
          set -euo pipefail
          C=kernel/.config
          M=kernel/System.map
          H=kernel/drivers/mtd/nand/hinand_hwt101.c
          Y1=kernel/fs/yaffs2/yaffs_mtdif.c
          Y2=kernel/fs/yaffs2/yaffs_mtdif2.c
          T=kernel/drivers/huawei/hsad/config_total_product.c
          K=kernel/drivers/huawei/hsad/auto-generate/hw_hwt101_fix10_k3oem_configs.c

          grep -qx '3.0.8-g883717a-dirty' V410-KERNELRELEASE.txt
          grep -qx 'CONFIG_BT=y' "$C"
          grep -qx 'CONFIG_CFG80211=y' "$C"
          grep -qx 'CONFIG_TI_ST=y' "$C"
          grep -qx '# CONFIG_ST_HCI is not set' "$C"
          grep -Eq ' [tT] st_register$' "$M"
          grep -Eq ' [tT] st_unregister$' "$M"

          grep -q '#define HWT_ANDROID_FIRST_PAGE 0x16500U' "$H"
          grep -q '#define HWT_ANDROID_LAST_PAGE  0xfffffU' "$H"
          grep -q 'HWT101_V405_ANDROID_GUARD: ALLOW PAGEPROG' "$H"
          grep -q 'HWT101_V405_ANDROID_GUARD: ALLOW ERASE2' "$H"
          grep -q 'loff_t addr =' "$Y1"
          test "$(grep -c '((loff_t) block_no) \* dev->param.chunks_per_block \*' "$Y2")" -ge 2

          grep -q 'hw_hwt101_fix10_k3oem_configs.c' "$T"
          grep -q '&config_common_hwt101_fix10_k3oem' "$T"
          grep -q '.board_id = 0x00' "$K"
          grep -q '"audio/audience".*"NONE"' "$K"
          grep -q '"audio/dual_mic", (unsigned int)0' "$K"
          grep -q '"iomux/iomux_type", (unsigned int)0' "$K"
          grep -q '"keypad/keypad_type", (unsigned int)1' "$K"
          grep -q '"sensor/sensor_type", (unsigned int)1' "$K"
          grep -q '"product/name".*"k3oem"' "$K"
          test "$(grep -c '^    {"' "$K")" -eq 21

          {
            echo '=== HWT101 V4.10 FIX10 EXACT K3OEM AUDIT ==='
            echo BUILD=PASS
            echo BASE=V4.07B_HARDWARE_PASS
            echo ONLY_CHANGE=EXACT_FIX10_BOARDID0_PROFILE
            echo FIX10_PROFILE_PAIR_COUNT=21
            echo FIX10_BOARD_ID=0x00
            echo FIX10_AUDIENCE=NONE
            echo FIX10_DUAL_MIC=0
            echo FIX10_IOMUX_TYPE=0
            echo FIX10_KEYPAD_TYPE=1
            echo FIX10_SENSOR_TYPE=1
            echo FIX10_PRODUCT=k3oem
            echo PUBLIC_K3OEM_V408=NOT_USED
            echo HDMI_V409_PATCH=NOT_USED
            echo V405_WRITE_GUARD=PRESERVED
            echo V406_YAFFS64=PRESERVED
            echo TI_ST=PRESERVED
            echo KERNELRELEASE=3.0.8-g883717a-dirty
            echo "ZIMAGE_SIZE=$(cat V410-SIZE.txt)"
            echo "ZIMAGE_SHA256=$(cut -d' ' -f1 V410-SHA256.txt)"
          } | tee V410-FINAL-AUDIT.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HWT101-V4.10-FIX10-EXACT-K3OEM
          include-hidden-files: true
          path: |
            HWT101-V4.10-*
            V410-*.txt
            V405-*.txt
            V406-*.txt
            kernel/.config
            kernel/System.map
            kernel/drivers/huawei/hsad/config_total_product.c
            kernel/drivers/huawei/hsad/auto-generate/hw_hwt101_fix10_k3oem_configs.c
            kernel/drivers/mtd/nand/hinand_hwt101.c
            kernel/fs/yaffs2/yaffs_mtdif.c
            kernel/fs/yaffs2/yaffs_mtdif2.c
          if-no-files-found: error
