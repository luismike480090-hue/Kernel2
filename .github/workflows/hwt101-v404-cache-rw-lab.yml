name: HWT101 V4.04 CACHE-only RW Lab

on:
  workflow_dispatch:
  push:
    branches:
      - v404-cache-rw-lab
    paths:
      - '.github/workflows/hwt101-v404-cache-rw-lab.yml'
      - 'scripts/patch_hwt101_v404_cache_rw_guard.py'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -e
          sudo dpkg --add-architecture i386 || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y build-essential bc git libc6-i386 lib32z1 lib32stdc++6 libspreadsheet-parseexcel-perl

      - name: Reproduce exact V4.03 and add CACHE-only write guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          wf = Path('.github/workflows/hwt101-v403-ro-yaffs-oem-parity.yml').read_text()
          marker = '      - name: Reproduce exact V4.01 and add OEM YAFFS2 options\n'
          p = wf.find(marker)
          if p < 0: raise SystemExit('V4.03 derivation step missing')
          r = wf.find('        run: |\n', p)
          if r < 0: raise SystemExit('V4.03 run block missing')
          r += len('        run: |\n')
          e = wf.find('\n      - name:', r)
          if e < 0: raise SystemExit('V4.03 run block end missing')
          lines=[]
          for line in wf[r:e].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          subprocess.run('\n'.join(lines)+'\n', shell=True, executable='/bin/bash', check=True)

          pth=Path('scripts/build_hwt101_v363_ntfs_prune.sh')
          s=pth.read_text()
          anchor='python3 scripts/patch_hwt101_v401_readonly_guard.py kernel | tee V401-READONLY-GUARD.txt\n'
          if anchor not in s:
              raise SystemExit('V4.01 patch invocation missing')
          s=s.replace(anchor, anchor+'python3 scripts/patch_hwt101_v404_cache_rw_guard.py kernel | tee V404-CACHE-RW-GUARD.txt\n',1)
          pth.write_text(s)
          print('V404_DERIVATION=PASS')
          print('BASE=EXACT_V403_RO_YAFFS_OEM_PARITY')
          print('WRITE_SCOPE=CACHE_ONLY')
          print('PHYSICAL_PAGE_RANGE=0x36500..0x3e4ff')
          PY

      - name: Build V4.04 CACHE RW lab
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_hwt101_v363_ntfs_prune.sh
          cp HWT101-V3.63-FIX10-NTFS-PRUNE-zImage HWT101-V4.04-CACHE-RW-LAB-zImage
          cp kernel/vmlinux HWT101-V4.04-CACHE-RW-LAB-vmlinux
          cp kernel/System.map HWT101-V4.04-CACHE-RW-LAB-System.map
          sha256sum HWT101-V4.04-CACHE-RW-LAB-zImage | tee V404-SHA256.txt
          stat -c%s HWT101-V4.04-CACHE-RW-LAB-zImage | tee V404-SIZE.txt

      - name: CACHE-only write safety audit
        shell: bash
        run: |
          set -euo pipefail
          H=kernel/drivers/mtd/nand/hinand_hwt101.c
          C=kernel/.config
          Z=HWT101-V4.04-CACHE-RW-LAB-zImage
          OEM_SIZE=4124692
          SIZE=$(stat -c%s "$Z")

          grep -qx 'CONFIG_YAFFS_FS=y' "$C"
          grep -qx 'CONFIG_YAFFS_YAFFS2=y' "$C"
          grep -qx 'CONFIG_YAFFS_DISABLE_TAGS_ECC=y' "$C"
          grep -qx 'CONFIG_YAFFS_EMPTY_LOST_AND_FOUND=y' "$C"

          grep -q '#define HWT_CACHE_FIRST_PAGE 0x36500U' "$H"
          grep -q '#define HWT_CACHE_LAST_PAGE  0x3e4ffU' "$H"
          grep -q 'hwt_cache_page_allowed(page)' "$H"
          grep -q 'BLOCK PAGEPROG page=0x%x' "$H"
          grep -q 'BLOCK ERASE2 page=0x%x' "$H"
          grep -q 'nfc_write(h,0x1080,NFC_CMD)' "$H"
          grep -q 'nfc_write(h,0x23,NFC_DMA_CTRL)' "$H"
          grep -q 'nfc_write(h,0xd060,NFC_CMD)' "$H"
          grep -q 'nfc_write(h,(h->addr_cycle<<9)|0x6d,NFC_OP)' "$H"
          grep -q 'parts\[pi\].mask_flags |= MTD_WRITEABLE' "$H"
          grep -q 'strcmp(parts\[pi\].name,"cache")' "$H"
          grep -q 'h->mtd.flags |= MTD_WRITEABLE;' "$H"
          ! grep -q 'HWT101_V401_RO_GUARD: BLOCK PAGEPROG' "$H"
          ! grep -q 'HWT101_V401_RO_GUARD: BLOCK ERASE2' "$H"
          grep -q '.offset = 2, .length = 30' "$H"
          grep -q 'nfc_write(h,HWT_DMA_SIZE,NFC_CMD)' "$H"
          grep -q 'nfc_write(h,0x21,NFC_DMA_CTRL)' "$H"
          ! grep -q 'hwt_capture_system_raw' "$H"
          test "$SIZE" -le "$OEM_SIZE"

          {
            echo '=== HWT101 V4.04 CACHE-ONLY RW LAB AUDIT ==='
            echo BUILD=PASS
            echo BASE=V4.03_RO_YAFFS_OEM_PARITY
            echo YAFFS_NO_TAGS_ECC=1
            echo YAFFS_EMPTY_LOST_N_FOUND=1
            echo CACHE_FIRST_PAGE=0x36500
            echo CACHE_LAST_PAGE=0x3e4ff
            echo PAGEPROG=OEM_SEQUENCE_CACHE_ONLY
            echo ERASE2=OEM_SEQUENCE_CACHE_ONLY
            echo NON_CACHE_PARTITIONS=MTD_READONLY
            echo NON_CACHE_PHYSICAL_WRITES=BLOCKED
            echo OEM_OOBFREE=2..31_LEN30
            echo "ZIMAGE_SIZE=$SIZE"
            echo "ZIMAGE_SHA256=$(cut -d' ' -f1 V404-SHA256.txt)"
          } | tee V404-FINAL-AUDIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HWT101-V4.04-CACHE-RW-LAB
          include-hidden-files: true
          path: |
            HWT101-V4.04-*
            V400-*.txt
            V401-*.txt
            V403-*.txt
            V404-*.txt
            kernel/.config
            kernel/System.map
            kernel/drivers/mtd/nand/hinand_hwt101.c
            kernel/drivers/mtd/nand/nand_base.c
            kernel/drivers/mtd/nand/nand_ids.c
            kernel/drivers/mtd/cmdlinepart.c
            kernel/fs/yaffs2/yaffs_vfs.c
            kernel/fs/yaffs2/yaffs_mtdif2.c
          if-no-files-found: error
