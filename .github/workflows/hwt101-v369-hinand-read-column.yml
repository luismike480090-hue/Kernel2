name: HWT101 V3.69 HiNAND Read Column Fix

on:
  push:
    branches: [ v369-hinand-read-column ]
    paths:
      - '.github/workflows/hwt101-v369-hinand-read-column.yml'
      - 'scripts/patch_hwt101_v369_hinand_read_column.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -e
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*google*' -o -iname '*chrome*' \) -print -delete || true
          sudo dpkg --add-architecture i386 || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y build-essential bc git libc6-i386 lib32z1 lib32stdc++6 libspreadsheet-parseexcel-perl

      - name: Reproduce exact V3.68 and apply V3.69 read-column fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          wf = Path('.github/workflows/hwt101-v368-hinand-init-size-oob.yml').read_text()
          marker = '      - name: Reproduce exact V3.67 and apply V3.68 geometry/OOB\n'
          p = wf.find(marker)
          if p < 0: raise SystemExit('V3.68 derivation step missing')
          r = wf.find('        run: |\n', p)
          if r < 0: raise SystemExit('V3.68 run block missing')
          r += len('        run: |\n')
          e = wf.find('\n      - name:', r)
          if e < 0: raise SystemExit('V3.68 run block end missing')
          lines=[]
          for line in wf[r:e].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          subprocess.run('\n'.join(lines)+'\n', shell=True, executable='/bin/bash', check=True)

          pth=Path('scripts/build_hwt101_v363_ntfs_prune.sh')
          s=pth.read_text()
          anchor='python3 scripts/patch_hwt101_v368_hinand_init_size_oob.py kernel | tee V368-HINAND-GEOMETRY-PATCH.txt\n'
          if anchor not in s: raise SystemExit('V3.68 patch anchor missing')
          s=s.replace(anchor, anchor+'python3 scripts/patch_hwt101_v369_hinand_read_column.py kernel | tee V369-HINAND-READ-COLUMN-PATCH.txt\n', 1)
          pth.write_text(s)

          print('V369_DERIVATION=PASS')
          print('BASE=EXACT_V368_HARDWARE_TESTED')
          print('CHANGE=READSTART_COLUMN_CAPTURE_ONLY')
          print('NAND_GEOMETRY=UNCHANGED')
          print('MEMORY_PATCH=NONE')
          PY

      - name: Build and audit V3.69
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_hwt101_v363_ntfs_prune.sh
          cp HWT101-V3.63-FIX10-NTFS-PRUNE-zImage HWT101-V3.69-HINAND-READ-COLUMN-zImage
          cp kernel/vmlinux HWT101-V3.69-HINAND-READ-COLUMN-vmlinux
          cp kernel/System.map HWT101-V3.69-HINAND-READ-COLUMN-System.map
          sha256sum HWT101-V3.69-HINAND-READ-COLUMN-zImage | tee V369-SHA256.txt
          stat -c%s HWT101-V3.69-HINAND-READ-COLUMN-zImage | tee V369-SIZE.txt

          Z=HWT101-V3.69-HINAND-READ-COLUMN-zImage
          SIZE=$(stat -c%s "$Z")
          OEM_SIZE=4124692
          HP=kernel/drivers/mtd/nand/hinand_hwt101.c
          MAP=kernel/System.map

          grep -aFq 'HWT101_V369_HINAND_DIAG' kernel/vmlinux
          grep -q 'case NAND_CMD_READSTART: h->column=h->addr\[0\]&0xffff;' "$HP"
          grep -q 'h->column=0; h->page_offset=0; memcpy(h->dma_buf' "$HP"

          # Preserve all V3.68 hardware-proven fixes.
          grep -q 'mtd->writesize = 8192;' "$HP"
          grep -q 'mtd->oobsize = 448;' "$HP"
          grep -q 'mtd->erasesize = 2 \* 1024 \* 1024;' "$HP"
          grep -q '.offset = 2, .length = 446' "$HP"
          grep -q 'h->chip.init_size=hwt_hinand_init_size' "$HP"
          grep -q 'h->chip.ecc.layout=&hwt_hinand_oob_448' "$HP"
          grep -q 'h->regs=ioremap_nocache(r1->start,resource_size(r1));' "$HP"
          grep -q 'h->aux=ioremap_nocache(r0->start,resource_size(r0));' "$HP"
          grep -q '.coherent_dma_mask=0xffffffffULL,' "$HP"

          # Preserve display and core kernel.
          grep -q 'pinfo->xres = 1280;' kernel/drivers/video/k3/panel/mipi_toshiba_MDW70_V001.c
          grep -q 'pinfo->yres = 800;' kernel/drivers/video/k3/panel/mipi_toshiba_MDW70_V001.c
          for sym in k3_fb_init mipi_toshiba_panel_init mipi_toshiba_panel_set_fastboot sn65dsi83_probe mipi_dsi_probe ldi_probe nand_scan hinand_probe s5k5cag_module_init; do
            grep -Eq " [tT] ${sym}$" "$MAP" || { echo "MISSING_SYMBOL=$sym"; exit 91; }
          done

          test "$SIZE" -le "$OEM_SIZE"
          grep -qx '# CONFIG_SWAP is not set' kernel/.config
          grep -qx '# CONFIG_ZRAM is not set' kernel/.config

          {
            echo '=== V3.69 HWT101 HINAND READ COLUMN AUDIT ==='
            echo V369_BINARY=PASS
            echo BASE=V368_HARDWARE_TESTED
            echo FIX=READSTART_COLUMN_CAPTURE
            echo READID_COLUMN_RESET=YES
            echo NAND_GEOMETRY=8192_448_2097152_8GiB
            echo OOB_LAYOUT=OFFSET2_LEN446_UNCHANGED
            echo CONTROLLER_MAP=0xFD200000
            echo DATA_MAP=0xFD100000
            echo DMA_MASK=0xffffffff
            echo ZIMAGE_SIZE=$SIZE
            echo OEM_ZIMAGE_SIZE=$OEM_SIZE
            echo MARGIN_VS_OEM=$((OEM_SIZE-SIZE))
            echo SWAP_ZRAM=OFF
          } | tee V369-FINAL-AUDIT.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HWT101-V3.69-HINAND-READ-COLUMN
          include-hidden-files: true
          path: |
            HWT101-V3.69-*
            V369-*.txt
            kernel/.config
            kernel/System.map
            kernel/drivers/mtd/nand/hinand_hwt101.c
            kernel/drivers/mtd/nand/nand_base.c
            kernel/drivers/mtd/nand/nand_ids.c

# trigger V3.69 build
