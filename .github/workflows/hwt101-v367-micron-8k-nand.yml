name: HWT101 V3.67 Micron 8K NAND

on:
  push:
    branches: [ v367-micron-8k-nand ]
    paths:
      - '.github/workflows/hwt101-v367-micron-8k-nand.yml'
      - 'scripts/patch_hwt101_v367_micron_8k_nand.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -e
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*google*' -o -iname '*chrome*' \) -print -delete || true
          sudo dpkg --add-architecture i386 || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y build-essential bc git libc6-i386 lib32z1 lib32stdc++6 libspreadsheet-parseexcel-perl

      - name: Reproduce exact V3.66 and add Micron 8K NAND support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          wf = Path('.github/workflows/hwt101-v366-hinand-map-swap.yml').read_text()
          marker = '      - name: Reproduce V3.63 and apply NAND fixes through V3.66\n'
          p = wf.find(marker)
          if p < 0: raise SystemExit('V3.66 derivation step missing')
          r = wf.find('        run: |\n', p)
          if r < 0: raise SystemExit('V3.66 run block missing')
          r += len('        run: |\n')
          e = wf.find('\n      - name:', r)
          if e < 0: raise SystemExit('V3.66 run block end missing')
          lines=[]
          for line in wf[r:e].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          subprocess.run('\n'.join(lines)+'\n', shell=True, executable='/bin/bash', check=True)

          pth=Path('scripts/build_hwt101_v363_ntfs_prune.sh')
          s=pth.read_text()
          anchor='python3 scripts/patch_hwt101_v366_hinand_map_swap.py kernel | tee V366-MAP-SWAP-PATCH.txt\n'
          if anchor not in s: raise SystemExit('V3.66 map patch anchor missing')
          s=s.replace(anchor, anchor+'python3 scripts/patch_hwt101_v367_micron_8k_nand.py kernel | tee V367-MICRON-PATCH.txt\n', 1)
          pth.write_text(s)
          print('V367_DERIVATION=PASS')
          print('BASE=EXACT_V366')
          print('CHANGE=MICRON_MT29F64G08CBAAA_SUPPORT')
          print('MEMORY_PATCH=NONE')
          PY

      - name: Build and audit V3.67
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_hwt101_v363_ntfs_prune.sh
          cp HWT101-V3.63-FIX10-NTFS-PRUNE-zImage HWT101-V3.67-MICRON-8K-NAND-zImage
          cp kernel/vmlinux HWT101-V3.67-MICRON-8K-NAND-vmlinux
          cp kernel/System.map HWT101-V3.67-MICRON-8K-NAND-System.map
          sha256sum HWT101-V3.67-MICRON-8K-NAND-zImage | tee V367-SHA256.txt
          stat -c%s HWT101-V3.67-MICRON-8K-NAND-zImage | tee V367-SIZE.txt

          Z=HWT101-V3.67-MICRON-8K-NAND-zImage
          SIZE=$(stat -c%s "$Z")
          OEM_SIZE=4124692
          HP=kernel/drivers/mtd/nand/hinand_hwt101.c
          NB=kernel/drivers/mtd/nand/nand_base.c
          NI=kernel/drivers/mtd/nand/nand_ids.c
          MAP=kernel/System.map

          grep -aFq 'HWT101_V367_HINAND_DIAG' kernel/vmlinux
          grep -q '0x88, 0, 8192, 0, LP_OPTIONS' "$NI"
          grep -q 'id_data\[0\] == NAND_MFR_MICRON' "$NB"
          grep -q 'mtd->oobsize = ((extid & 0x03) == 0x03 ? 218 :' "$NB"
          grep -q 'READID_HI32=0x%08x' "$HP"
          grep -q 'WRITESIZE=%u' "$HP"
          grep -q 'hwt_diag_mtd_size=h->mtd.size' "$HP"

          # V3.66 hardware fixes preserved.
          grep -q 'h->regs=ioremap_nocache(r1->start,resource_size(r1));' "$HP"
          grep -q 'h->aux=ioremap_nocache(r0->start,resource_size(r0));' "$HP"
          grep -q '.coherent_dma_mask=0xffffffffULL,' "$HP"

          # Preserve V3.63 memory/display baseline and critical symbols.
          grep -q $'#define LCD_XRES\t(720)' kernel/arch/arm/mach-k3v2/include/mach/hisi_mem.h
          grep -q $'#define LCD_YRES\t(1280)' kernel/arch/arm/mach-k3v2/include/mach/hisi_mem.h
          ! grep -q '160497664UL' kernel/arch/arm/mach-k3v2/include/mach/hisi_mem.h
          grep -q 'pinfo->xres = 1280;' kernel/drivers/video/k3/panel/mipi_toshiba_MDW70_V001.c
          grep -q 'pinfo->yres = 800;' kernel/drivers/video/k3/panel/mipi_toshiba_MDW70_V001.c
          for sym in k3_fb_init mipi_toshiba_panel_init mipi_toshiba_panel_set_fastboot sn65dsi83_probe mipi_dsi_probe ldi_probe nand_scan hinand_probe s5k5cag_module_init; do
            grep -Eq " [tT] ${sym}$" "$MAP" || { echo "MISSING_SYMBOL=$sym"; exit 91; }
          done
          test "$SIZE" -le "$OEM_SIZE"
          grep -qx '# CONFIG_SWAP is not set' kernel/.config
          grep -qx '# CONFIG_ZRAM is not set' kernel/.config

          {
            echo '=== V3.67 HWT101 MICRON 8K NAND AUDIT ==='
            echo V367_BINARY=PASS
            echo BASE=V366_MAP_SWAP_DMA_FIX
            echo MICRON_ID=2c:88:04:4b:a9:00:00
            echo DEVICE=MT29F64G08CBAAA
            echo NAND_SIZE=8GiB
            echo PAGE_SIZE=8192
            echo OOB_SIZE=448
            echo ERASE_SIZE=2097152
            echo CONTROLLER_MAP=0xFD200000
            echo DATA_MAP=0xFD100000
            echo DMA_MASK=0xffffffff
            echo ZIMAGE_SIZE=$SIZE
            echo OEM_ZIMAGE_SIZE=$OEM_SIZE
            echo MARGIN_VS_OEM=$((OEM_SIZE-SIZE))
            echo SWAP_ZRAM=OFF
          } | tee V367-FINAL-AUDIT.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HWT101-V3.67-MICRON-8K-NAND
          include-hidden-files: true
          path: |
            HWT101-V3.67-*
            V367-*.txt
            kernel/.config
            kernel/System.map
            kernel/drivers/mtd/nand/hinand_hwt101.c
            kernel/drivers/mtd/nand/nand_base.c
            kernel/drivers/mtd/nand/nand_ids.c
            kernel/arch/arm/mach-k3v2/include/mach/hisi_mem.h
