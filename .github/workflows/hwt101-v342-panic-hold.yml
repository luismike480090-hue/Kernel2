name: HWT101 V3.42 PANIC HOLD DIAGNOSTIC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc git wget xz-utils lzop libspreadsheet-parseexcel-perl python3

      - name: Clone Huawei K3V2 base
        run: |
          git clone https://github.com/mangusta86/android_kernel_huawei_k3v2oem1.git kernel
          git -C kernel checkout 675c975cf79dd2b0272b452e5706e1ba60e1b428

      - name: GCC 4.6.3
        run: |
          wget -q https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/4.6.3/x86_64-gcc-4.6.3-nolibc_arm-unknown-linux-gnueabi.tar.xz
          tar -xf x86_64-gcc-4.6.3-nolibc_arm-unknown-linux-gnueabi.tar.xz
          TC="$(find "$PWD" -type f -name 'arm-unknown-linux-gnueabi-gcc' | head -1)"
          test -n "$TC"
          echo "TCBIN=$(dirname "$TC")" >> "$GITHUB_ENV"

      - name: Host and YAFFS compatibility
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/defined[[:space:]]*\([[:space:]]*\@([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*\)/@\1/g' kernel/timeconst.pl
          sed -i -E 's/defined[[:space:]]*\([[:space:]]*\%([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*\)/%\1/g' kernel/timeconst.pl
          YAFFS_VFS=fs/yaffs2/yaffs_vfs.c
          sed -i '/^[[:space:]]*#include[[:space:]]*<linux\/smp_lock\.h>[[:space:]]*$/d' "$YAFFS_VFS" || true
          python3 - "$YAFFS_VFS" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text()
          s=re.sub(r'static int yaffs_read_super\(struct file_system_type \*fs,\s*int flags, const char \*dev_name,\s*void \*data, struct vfsmount \*mnt\)\s*\{\s*return get_sb_bdev\(fs, flags, dev_name, data,\s*yaffs_internal_read_super_mtd, mnt\);\s*\}', 'static struct dentry *yaffs_mount(struct file_system_type *fs,\\n\\t\\t\\t\\t int flags, const char *dev_name, void *data)\\n{\\n\\treturn mount_bdev(fs, flags, dev_name, data,\\n\\t\\t\\t  yaffs_internal_read_super_mtd);\\n}', s, flags=re.S)
          s=re.sub(r'static int yaffs2_read_super\(struct file_system_type \*fs,\s*int flags, const char \*dev_name, void \*data,\s*struct vfsmount \*mnt\)\s*\{\s*return get_sb_bdev\(fs, flags, dev_name, data,\s*yaffs2_internal_read_super_mtd, mnt\);\s*\}', 'static struct dentry *yaffs2_mount(struct file_system_type *fs,\\n\\t\\t\\t\\t  int flags, const char *dev_name, void *data)\\n{\\n\\treturn mount_bdev(fs, flags, dev_name, data,\\n\\t\\t\\t  yaffs2_internal_read_super_mtd);\\n}', s, flags=re.S)
          s=s.replace('.get_sb = yaffs_read_super,', '.mount = yaffs_mount,')
          s=s.replace('.get_sb = yaffs2_read_super,', '.mount = yaffs2_mount,')
          p.write_text(s)
          PY

      - name: Configure and apply V3.41 hardware parity
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm CROSS_COMPILE="$TCBIN/arm-unknown-linux-gnueabi-"
          make -C kernel hisi_k3v2oem1_defconfig
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('kernel/.config'); s=p.read_text()
          def y(n):
              global s
              s=re.sub(r'^CONFIG_'+n+r'=.*\n|^# CONFIG_'+n+r' is not set\n','',s,flags=re.M); s+='CONFIG_'+n+'=y\n'
          def n(nm):
              global s
              s=re.sub(r'^CONFIG_'+nm+r'=.*\n|^# CONFIG_'+nm+r' is not set\n','',s,flags=re.M); s+='# CONFIG_'+nm+' is not set\n'
          for x in ['MACH_K3V2OEM1','MACH_K3V2OEM2','LCD_TOSHIBA_MDW70','MTD','MTD_BLOCK','MTD_CMDLINE_PARTS','MTD_NAND','MTD_NAND_IDS','MISC_FILESYSTEMS','YAFFS_FS','YAFFS_YAFFS1','YAFFS_YAFFS2','YAFFS_AUTO_YAFFS2']: y(x)
          for x in ['LCD_TOSHIBA_MDY90','LCD_CMI_OTM1280A','LCD_PANASONIC_VVX10F002A00','LCD_JDI_OTM1282B','ZRAM','ZSMALLOC','BCMDHD']: n(x)
          s=re.sub(r'^CONFIG_LOCALVERSION=.*\n|^CONFIG_LOCALVERSION_AUTO=.*\n|^# CONFIG_LOCALVERSION_AUTO is not set\n','',s,flags=re.M)
          s+='CONFIG_LOCALVERSION="-g883717a-dirty"\n# CONFIG_LOCALVERSION_AUTO is not set\n'
          p.write_text(s)
          PY
          rm -f kernel/.scmversion
          make -C kernel LOCALVERSION= oldnoconfig
          python3 scripts/patch_hwt101_oem2_v341.py kernel | tee BOARD-V342.txt
          python3 -c "p='kernel/drivers/mtd/nand/hinand_hwt101.c'; s=open(p).read(); old='reinit_completion(&h->done);'; new='INIT_COMPLETION(h->done);'; assert old in s; open(p,'w').write(s.replace(old,new))"
          make -C kernel LOCALVERSION= oldnoconfig

      - name: Apply panic-hold diagnostic delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('kernel/.config'); s=p.read_text()
          s=re.sub(r'^CONFIG_PANIC_TIMEOUT=.*\n|^# CONFIG_PANIC_TIMEOUT is not set\n','',s,flags=re.M)
          s+='CONFIG_PANIC_TIMEOUT=0\n'
          p.write_text(s)
          PY
          export ARCH=arm CROSS_COMPILE="$TCBIN/arm-unknown-linux-gnueabi-"
          make -C kernel LOCALVERSION= oldnoconfig
          grep -qx 'CONFIG_PANIC_TIMEOUT=0' kernel/.config
          grep -qx 'CONFIG_ARM_HISIK3_WATCHDOG=y' kernel/.config || true
          echo 'V342_DIAGNOSTIC_DELTA=PANIC_TIMEOUT_0' | tee V342-DIAGNOSTIC.txt
          echo 'WATCHDOG_DRIVER_LEFT_UNCHANGED=YES' | tee -a V342-DIAGNOSTIC.txt

      - name: Build V3.42 diagnostic
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm CROSS_COMPILE="$TCBIN/arm-unknown-linux-gnueabi-"
          make LOCALVERSION= -j2 zImage V=0 2>&1 | tee ../BUILD-V342.log
          cat include/config/kernel.release | tee ../KERNELRELEASE-V342.txt

      - name: Audit diagnostic kernel
        shell: bash
        run: |
          set -euo pipefail
          MAP=kernel/System.map
          grep -E ' [rRdDtT] __mach_desc_K3V2OEM2$' "$MAP"
          test "$(grep -Ec ' [tT] k3v2oem1_init$' "$MAP")" -eq 2
          test "$(grep -Ec ' [tT] mipi_toshiba_panel_init$' "$MAP")" -eq 1
          for s in k3_fb_init mipi_dsi_probe sn65dsi83_probe hinand_probe hinand_module_init init_yaffs_fs yaffs2_mount st_kim_init wl12xx_set_platform_data wl12xx_get_platform_data; do grep -E " [tT] ${s}$" "$MAP"; done
          ! grep -Eq ' [tT] (dhd_bus_start|btbcm_device|bcm_bluesleep_device)$' "$MAP"
          grep -qx 'CONFIG_PANIC_TIMEOUT=0' kernel/.config
          sha256sum kernel/arch/arm/boot/zImage | tee SHA256-zImage-V342.txt
          wc -c kernel/arch/arm/boot/zImage | tee SIZE-zImage-V342.txt
          echo 'AUDIT_V342_DIAGNOSTIC=PASS' | tee -a V342-DIAGNOSTIC.txt

      - name: Upload V3.42 diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HWT101-V3.42-PANIC-HOLD-DIAGNOSTIC
          include-hidden-files: true
          path: |
            kernel/arch/arm/boot/zImage
            kernel/System.map
            kernel/.config
            BUILD-V342.log
            KERNELRELEASE-V342.txt
            BOARD-V342.txt
            V342-DIAGNOSTIC.txt
            SHA256-zImage-V342.txt
            SIZE-zImage-V342.txt
