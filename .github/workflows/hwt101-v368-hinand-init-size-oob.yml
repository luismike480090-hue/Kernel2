name: HWT101 V3.68 HiNAND Init Size OOB

on:
  push:
    branches: [ v368-hinand-init-size-oob ]
    paths:
      - '.github/workflows/hwt101-v368-hinand-init-size-oob.yml'
      - 'scripts/patch_hwt101_v368_hinand_init_size_oob.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -e
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*google*' -o -iname '*chrome*' \) -print -delete || true
          sudo dpkg --add-architecture i386 || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y build-essential bc git libc6-i386 lib32z1 lib32stdc++6 libspreadsheet-parseexcel-perl

      - name: Reproduce exact V3.67 and apply V3.68 geometry/OOB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          wf = Path('.github/workflows/hwt101-v367-micron-8k-nand.yml').read_text()
          marker = '      - name: Reproduce exact V3.66 and add Micron 8K NAND support\n'
          p = wf.find(marker)
          if p < 0: raise SystemExit('V3.67 derivation step missing')
          r = wf.find('        run: |\n', p)
          if r < 0: raise SystemExit('V3.67 run block missing')
          r += len('        run: |\n')
          e = wf.find('\n      - name:', r)
          if e < 0: raise SystemExit('V3.67 run block end missing')
          lines=[]
          for line in wf[r:e].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          subprocess.run('\n'.join(lines)+'\n', shell=True, executable='/bin/bash', check=True)

          pth=Path('scripts/build_hwt101_v363_ntfs_prune.sh')
          s=pth.read_text()
          anchor='python3 scripts/patch_hwt101_v367_micron_8k_nand.py kernel | tee V367-MICRON-PATCH.txt\n'
          if anchor not in s: raise SystemExit('V3.67 patch anchor missing')
          s=s.replace(anchor, anchor+'python3 scripts/patch_hwt101_v368_hinand_init_size_oob.py kernel | tee V368-HINAND-GEOMETRY-PATCH.txt\n', 1)
          pth.write_text(s)
          print('V368_DERIVATION=PASS')
          print('BASE=EXACT_V367_TESTED')
          print('CHANGE=INIT_SIZE_PLUS_448_OOB_LAYOUT')
          print('MEMORY_PATCH=NONE')
          PY

      - name: Build and audit V3.68
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_hwt101_v363_ntfs_prune.sh
          cp HWT101-V3.63-FIX10-NTFS-PRUNE-zImage HWT101-V3.68-HINAND-INIT-SIZE-OOB-zImage
          cp kernel/vmlinux HWT101-V3.68-HINAND-INIT-SIZE-OOB-vmlinux
          cp kernel/System.map HWT101-V3.68-HINAND-INIT-SIZE-OOB-System.map
          sha256sum HWT101-V3.68-HINAND-INIT-SIZE-OOB-zImage | tee V368-SHA256.txt
          stat -c%s HWT101-V3.68-HINAND-INIT-SIZE-OOB-zImage | tee V368-SIZE.txt

          Z=HWT101-V3.68-HINAND-INIT-SIZE-OOB-zImage
          SIZE=$(stat -c%s "$Z")
          OEM_SIZE=4124692
          HP=kernel/drivers/mtd/nand/hinand_hwt101.c
          NI=kernel/drivers/mtd/nand/nand_ids.c
          MAP=kernel/System.map

          grep -aFq 'HWT101_V368_HINAND_DIAG' kernel/vmlinux
          grep -q 'hwt_hinand_init_size' "$HP"
          grep -q 'mtd->writesize = 8192;' "$HP"
          grep -q 'mtd->oobsize = 448;' "$HP"
          grep -q 'mtd->erasesize = 2 \* 1024 \* 1024;' "$HP"
          grep -q 'chip->options &= ~NAND_BUSWIDTH_16;' "$HP"
          grep -q '.offset = 2, .length = 446' "$HP"
          grep -q 'h->chip.init_size=hwt_hinand_init_size' "$HP"
          grep -q 'h->chip.ecc.layout=&hwt_hinand_oob_448' "$HP"
          grep -q '0x88, 0, 8192, 0, LP_OPTIONS' "$NI"

          # Preserve hardware fixes already proven in V3.66/V3.67.
          grep -q 'h->regs=ioremap_nocache(r1->start,resource_size(r1));' "$HP"
          grep -q 'h->aux=ioremap_nocache(r0->start,resource_size(r0));' "$HP"
          grep -q '.coherent_dma_mask=0xffffffffULL,' "$HP"

          # Preserve V3.63 memory baseline; no V3.64 RAM experiment.
          grep -q $'#define LCD_XRES\t(720)' kernel/arch/arm/mach-k3v2/include/mach/hisi_mem.h
          grep -q $'#define LCD_YRES\t(1280)' kernel/arch/arm/mach-k3v2/include/mach/hisi_mem.h
          ! grep -q '160497664UL' kernel/arch/arm/mach-k3v2/include/mach/hisi_mem.h

          grep -q 'pinfo->xres = 1280;' kernel/drivers/video/k3/panel/mipi_toshiba_MDW70_V001.c
          grep -q 'pinfo->yres = 800;' kernel/drivers/video/k3/panel/mipi_toshiba_MDW70_V001.c
          for sym in k3_fb_init mipi_toshiba_panel_init mipi_toshiba_panel_set_fastboot sn65dsi83_probe mipi_dsi_probe ldi_probe nand_scan hinand_probe s5k5cag_module_init; do
            grep -Eq " [tT] ${sym}$" "$MAP" || { echo "MISSING_SYMBOL=$sym"; exit 91; }
          done
          test "$SIZE" -le "$OEM_SIZE"
          grep -qx '# CONFIG_SWAP is not set' kernel/.config
          grep -qx '# CONFIG_ZRAM is not set' kernel/.config

          {
            echo '=== V3.68 HWT101 HINAND INIT_SIZE/OOB AUDIT ==='
            echo V368_BINARY=PASS
            echo BASE=V367_TESTED
            echo MICRON_ID=2c:88:04:4b:00:00:00:00
            echo NAND_SIZE=8GiB
            echo PAGE_SIZE=8192
            echo OOB_SIZE=448
            echo ERASE_SIZE=2097152
            echo BUSWIDTH=8
            echo OOBFREE_OFFSET=2
            echo OOBFREE_LENGTH=446
            echo CONTROLLER_MAP=0xFD200000
            echo DATA_MAP=0xFD100000
            echo DMA_MASK=0xffffffff
            echo ZIMAGE_SIZE=$SIZE
            echo OEM_ZIMAGE_SIZE=$OEM_SIZE
            echo MARGIN_VS_OEM=$((OEM_SIZE-SIZE))
            echo SWAP_ZRAM=OFF
          } | tee V368-FINAL-AUDIT.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HWT101-V3.68-HINAND-INIT-SIZE-OOB
          include-hidden-files: true
          path: |
            HWT101-V3.68-*
            V368-*.txt
            kernel/.config
            kernel/System.map
            kernel/drivers/mtd/nand/hinand_hwt101.c
            kernel/drivers/mtd/nand/nand_base.c
            kernel/drivers/mtd/nand/nand_ids.c
            kernel/arch/arm/mach-k3v2/include/mach/hisi_mem.h
