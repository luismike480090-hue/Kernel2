name: HWT101 V3.51 RAMDIAG Robust

on:
  push:
    branches: [ v351-hinand-entry-checkpoint ]
    paths:
      - '.github/workflows/hwt101-v351-ramdiag-robust.yml'
      - 'scripts/patch_hwt101_v351_ramdiag.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies without external Chrome repo
        run: |
          set -e
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*google*' -o -iname '*chrome*' \) -print -delete || true
          sudo dpkg --add-architecture i386 || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y build-essential bc git libc6-i386 lib32z1 lib32stdc++6 libspreadsheet-parseexcel-perl

      - name: Source and toolchain
        run: |
          set -e
          git clone --depth 1 -b cm-10.1 https://github.com/mangusta86/android_kernel_huawei_k3v2oem1.git kernel
          test "$(git -C kernel rev-parse HEAD)" = "08fd9448a6bfc6923a5caa9da8260d3be930686c"
          git -C kernel rev-parse HEAD | tee V351-SOURCE-SHA.txt
          git clone --depth 1 https://github.com/radxa/android-platform-prebuilts-gcc-linux-x86-arm-arm-eabi-4.6.git gcc46
          gcc46/bin/arm-eabi-gcc --version | tee V351-GCC.txt
          grep -qi '4.6.x-google 20120106' V351-GCC.txt
          echo "TC=$PWD/gcc46/bin/arm-eabi-" >> "$GITHUB_ENV"
          sed -i -E 's/defined[[:space:]]*\([[:space:]]*\@([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*\)/@\1/g' kernel/kernel/timeconst.pl || true
          sed -i -E 's/defined[[:space:]]*\([[:space:]]*\%([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*\)/%\1/g' kernel/kernel/timeconst.pl || true

      - name: Configure FIX10 baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm SUBARCH=arm CROSS_COMPILE="$TC"
          make mrproper
          make hisi_k3v2oem1_defconfig
          set_y(){ sed -i "/^# CONFIG_$1 is not set/d;/^CONFIG_$1=/d" .config; echo "CONFIG_$1=y" >> .config; }
          set_n(){ sed -i "/^# CONFIG_$1 is not set/d;/^CONFIG_$1=/d" .config; echo "# CONFIG_$1 is not set" >> .config; }
          set_v(){ sed -i "/^# CONFIG_$1 is not set/d;/^CONFIG_$1=/d" .config; echo "CONFIG_$1=$2" >> .config; }
          set_y LCD_TOSHIBA_MDW70
          for x in LCD_PANASONIC_VVX10F002A00 LCD_CMI_OTM1280A LCD_SAMSUNG_LMS350DF04 LCD_SAMSUNG_S6E39A LCD_SHARP_LS035B3SX LCD_CMI_PT045TN07 LCD_JDI_OTM1282B LCD_TOSHIBA_MDY90 LCD_K3_FAKE; do set_n "$x"; done
          for x in FB_K3 FB_K3_CLCD I2C REGULATOR HAS_EARLYSUSPEND EARLYSUSPEND LEDS_K3_6421 ANDROID_K3_VIBRATOR; do set_y "$x"; done
          for x in TOUCH_INPUT_SYNAPTICS_RMI4 TOUCHSCREEN_RMI4_SYNAPTICS_GENERIC SYNAPTICS_TOUCH_KEY SRECORDER BALONG_POWER BALONG_RMNET MHL_SII8240 MHL_SII9244; do set_n "$x"; done
          set_y XMM_POWER; set_y XMM_RMNET
          for x in MTD MTD_CHAR MTD_BLOCK MTD_PARTITIONS MTD_CMDLINE_PARTS MTD_NAND MTD_NAND_IDS MISC_FILESYSTEMS YAFFS_FS YAFFS_YAFFS2; do set_y "$x"; done
          for x in SWAP ZRAM XVMALLOC ZRAM_DEBUG; do set_n "$x"; done
          set_v PANIC_TIMEOUT 0
          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_LOCALVERSION_AUTO=/d;/^# CONFIG_LOCALVERSION_AUTO is not set/d' .config
          echo 'CONFIG_LOCALVERSION="-g883717a-dirty"' >> .config
          echo '# CONFIG_LOCALVERSION_AUTO is not set' >> .config
          rm -f .scmversion
          make oldnoconfig

      - name: Install exact T101 reconstruction and diagnostics
        run: |
          set -e
          python3 scripts/reconstruct_t101_board_cm10.py kernel | tee V351-BOARD-PATCH.txt
          grep -q 'platform=21, i2c=1/10/2' V351-BOARD-PATCH.txt
          cp oem_recovered/display/sn65dsi83_hwt101.c kernel/drivers/video/k3/sn65dsi83_hwt101.c
          cp oem_recovered/display/sn65dsi83_oem_table.h kernel/drivers/video/k3/sn65dsi83_oem_table.h
          python3 scripts/patch_hwt101_v350_golden.py kernel | tee V351-GOLDEN-PATCH.txt
          python3 scripts/patch_hwt101_yaffs_v350.py kernel | tee V351-YAFFS-PATCH.txt
          export ARCH=arm SUBARCH=arm CROSS_COMPILE="$TC"
          make -C kernel oldnoconfig
          python3 scripts/patch_hwt101_v351_ramdiag.py kernel | tee V351-RAMDIAG-PATCH.txt
          make -C kernel oldnoconfig
          cp kernel/.config V351-CONFIG.txt

      - name: RAMDIAG hard gate
        shell: bash
        run: |
          set -euo pipefail
          R=kernel/arch/arm/mach-k3v2/hwt101_ram_console.c
          N=kernel/drivers/mtd/nand/hinand_hwt101.c
          grep -q 'HWT101_RAMDIAG_START 0x2cfc0000' "$R"
          grep -q 'HWT101_RAMDIAG_SIZE  0x00040000' "$R"
          grep -q '"ram_console"' "$R"
          grep -q 'hwt101_ram_console.o' kernel/arch/arm/mach-k3v2/Makefile
          grep -q 'int initcall_debug = 1' kernel/init/main.c
          grep -qx 'CONFIG_ANDROID_RAM_CONSOLE=y' kernel/.config
          grep -qx 'CONFIG_ANDROID_RAM_CONSOLE_ENABLE_VERBOSE=y' kernel/.config
          grep -qx '# CONFIG_ANDROID_RAM_CONSOLE_EARLY_INIT is not set' kernel/.config
          grep -qx '# CONFIG_SWAP is not set' kernel/.config
          grep -qx 'CONFIG_PANIC_TIMEOUT=0' kernel/.config
          for s in 'HWTDIAG: HINAND PROBE ENTER' 'HWTDIAG: HINAND before resources' 'HWTDIAG: HINAND before init' 'HWTDIAG: HINAND IRQ OK before nand_scan' 'HWTDIAG: HINAND nand_scan returned' 'HWTDIAG: NAND RESET ENTER' 'HWTDIAG: NAND READID' 'HWTDIAG: NAND LBY DONE'; do grep -Fq "$s" "$N"; done
          echo RAMDIAG_SOURCE_GATE=PASS | tee V351-RAMDIAG-GATE.txt

      - name: Build zImage
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm SUBARCH=arm CROSS_COMPILE="$TC"
          make -j2 zImage 2>&1 | tee ../V351-BUILD.log
          cp arch/arm/boot/zImage ../HWT101-V3.51-FIX10-RAMDIAG-zImage
          cp vmlinux ../HWT101-V3.51-RAMDIAG-vmlinux
          cp System.map ../HWT101-V3.51-RAMDIAG-System.map
          "$TC"nm -n vmlinux > ../V351-NM-ORDERED.txt
          sha256sum arch/arm/boot/zImage | tee ../V351-SHA256.txt
          stat -c%s arch/arm/boot/zImage | tee ../V351-SIZE.txt

      - name: Binary audit
        shell: bash
        run: |
          set -euo pipefail
          MAP=kernel/System.map; VM=kernel/vmlinux; CFG=kernel/.config
          {
            echo '=== V3.51 PERSISTENT RAMDIAG AUDIT ==='
            for sym in ram_console_enable_console hwt101_ramdiag_register nand_scan hinand_probe hinand_irq hinand_init k3_fb_init mipi_toshiba_panel_init sn65dsi83_probe; do grep -Eq " [tT] ${sym}$" "$MAP" || exit 91; echo OK_SYMBOL=$sym; done
            for s in 'ram_console' 'HWTDIAG: RAMCONSOLE register' 'HWTDIAG: HINAND PROBE ENTER' 'HWTDIAG: NAND RESET ENTER' 'HWTDIAG: NAND READID' 'HWTDIAG: NAND LBY DONE'; do grep -aFq "$s" "$VM" || exit 92; echo OK_STRING=$s; done
            grep -qx 'CONFIG_ANDROID_RAM_CONSOLE=y' "$CFG"
            grep -qx '# CONFIG_SWAP is not set' "$CFG"
            grep -qx 'CONFIG_PANIC_TIMEOUT=0' "$CFG"
            echo RAMDIAG_BINARY=PASS
            echo SWAP_CONTROL=PASS
            echo PANIC_TIMEOUT=0
          } | tee V351-FINAL-AUDIT.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HWT101-V3.51-FIX10-PERSISTENT-RAMDIAG-ROBUST
          include-hidden-files: true
          path: |
            HWT101-V3.51-FIX10-RAMDIAG-zImage
            HWT101-V3.51-RAMDIAG-vmlinux
            HWT101-V3.51-RAMDIAG-System.map
            V351-CONFIG.txt
            V351-SOURCE-SHA.txt
            V351-GCC.txt
            V351-BOARD-PATCH.txt
            V351-GOLDEN-PATCH.txt
            V351-YAFFS-PATCH.txt
            V351-RAMDIAG-PATCH.txt
            V351-RAMDIAG-GATE.txt
            V351-BUILD.log
            V351-SHA256.txt
            V351-SIZE.txt
            V351-NM-ORDERED.txt
            V351-FINAL-AUDIT.txt
            kernel/arch/arm/mach-k3v2/hwt101_ram_console.c
            kernel/drivers/mtd/nand/hinand_hwt101.c
