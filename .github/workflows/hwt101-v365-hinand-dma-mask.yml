name: HWT101 V3.65 HiNAND DMA Mask

on:
  push:
    branches: [ v365-hinand-dma-mask ]
    paths:
      - '.github/workflows/hwt101-v365-hinand-dma-mask.yml'
      - 'scripts/patch_hwt101_v365_hinand_dma_mask.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -e
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*google*' -o -iname '*chrome*' \) -print -delete || true
          sudo dpkg --add-architecture i386 || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y build-essential bc git libc6-i386 lib32z1 lib32stdc++6 libspreadsheet-parseexcel-perl

      - name: Reproduce exact V3.63 and inject NAND diag plus DMA mask fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          wf = Path('.github/workflows/hwt101-v363-ntfs-prune.yml').read_text()
          marker = '      - name: Derive V3.63 from exact V3.62B baseline\n'
          p = wf.find(marker)
          if p < 0:
              raise SystemExit('V3.63 workflow derivation step not found')
          r = wf.find('        run: |\n', p)
          if r < 0:
              raise SystemExit('V3.63 run block not found')
          r += len('        run: |\n')
          e = wf.find('\n      - name:', r)
          if e < 0:
              raise SystemExit('V3.63 run block end not found')
          block = wf[r:e]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          subprocess.run('\n'.join(lines) + '\n', shell=True, executable='/bin/bash', check=True)

          pth = Path('scripts/build_hwt101_v363_ntfs_prune.sh')
          s = pth.read_text()
          anchor = 'python3 scripts/patch_hwt101_v356_panel_parity.py kernel | tee V363-PANEL-PATCH.txt\n'
          if anchor not in s:
              raise SystemExit('panel patch anchor missing')
          inject = (
              anchor
              + 'python3 scripts/patch_hwt101_v364a_nand_diag_only.py kernel | tee V365-NAND-DIAG-PATCH.txt\n'
              + 'python3 scripts/patch_hwt101_v365_hinand_dma_mask.py kernel | tee V365-DMA-MASK-PATCH.txt\n'
          )
          s = s.replace(anchor, inject, 1)
          pth.write_text(s)
          print('V365_DERIVATION=PASS')
          print('BASE=EXACT_V363')
          print('CHANGE_1=NAND_PROC_DIAG')
          print('CHANGE_2=HINAND_DMA_MASK_32BIT')
          print('MEMORY_PATCH=NONE')
          PY

      - name: Build and audit V3.65
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_hwt101_v363_ntfs_prune.sh
          cp HWT101-V3.63-FIX10-NTFS-PRUNE-zImage HWT101-V3.65-HINAND-DMA-MASK-zImage
          cp kernel/vmlinux HWT101-V3.65-HINAND-DMA-MASK-vmlinux
          cp kernel/System.map HWT101-V3.65-HINAND-DMA-MASK-System.map
          sha256sum HWT101-V3.65-HINAND-DMA-MASK-zImage | tee V365-SHA256.txt
          stat -c%s HWT101-V3.65-HINAND-DMA-MASK-zImage | tee V365-SIZE.txt

          Z=HWT101-V3.65-HINAND-DMA-MASK-zImage
          SIZE=$(stat -c%s "$Z")
          OEM_SIZE=4124692
          MAP=kernel/System.map
          HP=kernel/drivers/mtd/nand/hinand_hwt101.c

          grep -aFq 'HWT101_V364A_HINAND_DIAG' kernel/vmlinux
          grep -q 'create_proc_read_entry("hwt_hinand_diag",0444' "$HP"
          grep -q 'static u64 hwt_hinand_dma_mask = 0xffffffffULL;' "$HP"
          grep -q '.dma_mask=&hwt_hinand_dma_mask,' "$HP"
          grep -q '.coherent_dma_mask=0xffffffffULL,' "$HP"
          grep -q 'dma_alloc_coherent(&pdev->dev,HWT_DMA_SIZE,&h->dma_handle,GFP_KERNEL)' "$HP"

          # Do not reintroduce V3.64 memory experiment in this diagnostic build.
          grep -q $'#define LCD_XRES\t(720)' kernel/arch/arm/mach-k3v2/include/mach/hisi_mem.h
          grep -q $'#define LCD_YRES\t(1280)' kernel/arch/arm/mach-k3v2/include/mach/hisi_mem.h
          ! grep -q '160497664UL' kernel/arch/arm/mach-k3v2/include/mach/hisi_mem.h

          # Runtime panel and critical boot/storage symbols must remain present.
          grep -q 'pinfo->xres = 1280;' kernel/drivers/video/k3/panel/mipi_toshiba_MDW70_V001.c
          grep -q 'pinfo->yres = 800;' kernel/drivers/video/k3/panel/mipi_toshiba_MDW70_V001.c
          for sym in k3_fb_init mipi_toshiba_panel_init mipi_toshiba_panel_set_fastboot sn65dsi83_probe mipi_dsi_probe ldi_probe nand_scan hinand_probe s5k5cag_module_init; do
            grep -Eq " [tT] ${sym}$" "$MAP" || { echo "MISSING_SYMBOL=$sym"; exit 91; }
          done
          test "$SIZE" -le "$OEM_SIZE"
          grep -qx '# CONFIG_SWAP is not set' kernel/.config
          grep -qx '# CONFIG_ZRAM is not set' kernel/.config

          {
            echo '=== V3.65 HWT101 HINAND DMA MASK AUDIT ==='
            echo V365_BINARY=PASS
            echo BASE_MEMORY_LAYOUT=V363_UNCHANGED
            echo PANEL_RUNTIME=1280x800
            echo PROC_HINAND_DIAG=BUILTIN
            echo HINAND_DMA_MASK=0xffffffff
            echo HINAND_COHERENT_DMA_MASK=0xffffffff
            echo ZIMAGE_SIZE=$SIZE
            echo OEM_ZIMAGE_SIZE=$OEM_SIZE
            echo MARGIN_VS_OEM=$((OEM_SIZE-SIZE))
            echo SWAP_ZRAM=OFF
          } | tee V365-FINAL-AUDIT.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HWT101-V3.65-HINAND-DMA-MASK
          include-hidden-files: true
          path: |
            HWT101-V3.65-*
            V365-*.txt
            V363-FINAL-AUDIT.txt
            kernel/.config
            kernel/System.map
            kernel/drivers/mtd/nand/hinand_hwt101.c
            kernel/arch/arm/mach-k3v2/include/mach/hisi_mem.h
