name: HWT101 V3.49 FIX10 Boot Parity
# Retrigger after OEM2 touch-key/SRECORDER donor-path removal; boot-parity only.

on:
  push:
    branches: [ v349-oem-parity-research ]
    paths:
      - '.github/workflows/hwt101-v349-fix10-boot-parity.yml'
      - 'scripts/reconstruct_t101_board_cm10.py'
      - 'oem_recovered/display/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel2 research branch
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -e
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update
          sudo apt-get install -y build-essential bc git libc6-i386 lib32z1 lib32stdc++6 libspreadsheet-parseexcel-perl

      - name: Clone closest Huawei K3V2 OEM source
        run: |
          set -e
          git clone --depth 1 -b cm-10.1 https://github.com/mangusta86/android_kernel_huawei_k3v2oem1.git kernel
          git -C kernel rev-parse HEAD | tee V349-SOURCE-SHA.txt
          test "$(git -C kernel rev-parse HEAD)" = "08fd9448a6bfc6923a5caa9da8260d3be930686c"

      - name: Clone exact OEM-era GCC 4.6 family
        run: |
          set -e
          git clone --depth 1 https://github.com/radxa/android-platform-prebuilts-gcc-linux-x86-arm-arm-eabi-4.6.git gcc46
          gcc46/bin/arm-eabi-gcc --version | tee V349-GCC.txt
          grep -qi '4.6.x-google 20120106' V349-GCC.txt
          echo "TC=$PWD/gcc46/bin/arm-eabi-" >> "$GITHUB_ENV"

      - name: Patch host compatibility
        run: |
          set -e
          sed -i -E 's/defined[[:space:]]*\([[:space:]]*\@([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*\)/@\1/g' kernel/kernel/timeconst.pl || true
          sed -i -E 's/defined[[:space:]]*\([[:space:]]*\%([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*\)/%\1/g' kernel/kernel/timeconst.pl || true

      - name: Configure boot-parity baseline
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm SUBARCH=arm CROSS_COMPILE="$TC"
          make mrproper
          make hisi_k3v2oem1_defconfig

          set_y(){ sed -i "/^# CONFIG_$1 is not set/d;/^CONFIG_$1=/d" .config; echo "CONFIG_$1=y" >> .config; }
          set_n(){ sed -i "/^# CONFIG_$1 is not set/d;/^CONFIG_$1=/d" .config; echo "# CONFIG_$1 is not set" >> .config; }

          # FIX10 hardware-facing choices recovered from the OEM binary.
          set_y LCD_TOSHIBA_MDW70
          for x in LCD_PANASONIC_VVX10F002A00 LCD_CMI_OTM1280A LCD_SAMSUNG_LMS350DF04 LCD_SAMSUNG_S6E39A LCD_SHARP_LS035B3SX LCD_CMI_PT045TN07 LCD_JDI_OTM1282B LCD_TOSHIBA_MDY90 LCD_K3_FAKE; do set_n "$x"; done
          set_y FB_K3
          set_y FB_K3_CLCD
          set_y I2C
          set_y REGULATOR
          set_y HAS_EARLYSUSPEND
          set_y EARLYSUSPEND
          set_y LEDS_K3_6421
          set_y ANDROID_K3_VIBRATOR

          # cm-10.1 stale Synaptics board definitions are not the T101 topology.
          set_n TOUCH_INPUT_SYNAPTICS_RMI4
          set_n TOUCHSCREEN_RMI4_SYNAPTICS_GENERIC
          # The donor Synaptics touch-key consumes globals defined only by board-k3v2oem2.
          # FIX10 has FT5X0X/Goodix and virtual-key helpers, but no synaptics_work_func.
          set_n SYNAPTICS_TOUCH_KEY
          # FIX10 recovered kallsyms/strings contain no SRECORDER subsystem.
          set_n SRECORDER

          # FIX10 runtime exposes xmm_power + mu739_power, not balong_power.
          # Keep the genuine XMM/MU739 paths; remove the incompatible donor Balong path.
          set_y XMM_POWER
          set_y XMM_RMNET
          set_n BALONG_POWER
          set_n BALONG_RMNET

          # FIX10 registers Sii9244 page0/page1/page2/cbus I2C clients in the board,
          # but recovered OEM kallsyms/strings contain no built-in SII8240/SII9244 driver.
          # Preserve board topology while matching the OEM binary driver state.
          set_n MHL_SII8240
          set_n MHL_SII9244

          # Deliberate experimental control: V3.49 tests BOOT PARITY only.
          set_n SWAP
          set_n ZRAM
          set_n XVMALLOC
          set_n ZRAM_DEBUG

          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_LOCALVERSION_AUTO=/d;/^# CONFIG_LOCALVERSION_AUTO is not set/d' .config
          echo 'CONFIG_LOCALVERSION="-g883717a-dirty"' >> .config
          echo '# CONFIG_LOCALVERSION_AUTO is not set' >> .config
          rm -f .scmversion
          make oldnoconfig
          cp .config ../V349-CONFIG.txt

          grep -q '^CONFIG_LCD_TOSHIBA_MDW70=y$' .config
          grep -q '^# CONFIG_SYNAPICTICS_TOUCH_KEY is not set$' .config || true
          grep -q '^# CONFIG_SYNAPTICS_TOUCH_KEY is not set$' .config
          grep -q '^# CONFIG_SRECORDER is not set$' .config
          grep -q '^CONFIG_XMM_POWER=y$' .config
          grep -q '^# CONFIG_BALONG_POWER is not set$' .config
          grep -q '^# CONFIG_MHL_SII8240 is not set$' .config
          grep -q '^# CONFIG_MHL_SII9244 is not set$' .config
          grep -q '^# CONFIG_SWAP is not set$' .config
          grep -q '^# CONFIG_ZRAM is not set$' .config || true

      - name: Reconstruct T101 board from FIX10 disassembly
        run: |
          set -e
          python3 scripts/reconstruct_t101_board_cm10.py kernel | tee V349-BOARD-PATCH.txt
          grep -q 'platform=21, i2c=1/10/2' V349-BOARD-PATCH.txt

      - name: Install reconstructed SN65DSI83 bridge
        run: |
          set -e
          cp oem_recovered/display/sn65dsi83_hwt101.c kernel/drivers/video/k3/sn65dsi83_hwt101.c
          cp oem_recovered/display/sn65dsi83_oem_table.h kernel/drivers/video/k3/sn65dsi83_oem_table.h
          grep -q 'sn65dsi83_hwt101.o' kernel/drivers/video/k3/Makefile || echo 'obj-y += sn65dsi83_hwt101.o' >> kernel/drivers/video/k3/Makefile

      - name: Source topology hard gate
        run: |
          set -euo pipefail
          B=kernel/arch/arm/mach-k3v2/board-k3v2oem1.c
          for s in 'mipi_toshiba_MDW70_V001' 'sn65dsi83' 'bq2419x_charger' 'audience_es305' 'atmel_mxt224e' 'mhl_Sii9244_page0' 'mhl_Sii9244_page1' 'mhl_Sii9244_page2' 'mhl_Sii9244_cbus' 'ft5x0x_ts' 'Goodix-TS' 'bq_bci_battery' 'kim' 'bluesleep' 'btwilink'; do grep -q "$s" "$B"; done
          grep -q 'en_gpio = 79' "$B"
          grep -q 'max_charger_currentmA = 1800' "$B"
          grep -q 'max_cin_limit_currentmA = 1800' "$B"
          grep -q 'hwt101_i2c_bus0_devs' "$B"
          grep -q 'hwt101_i2c_bus1_devs' "$B"
          grep -q 'hwt101_i2c_bus2_devs' "$B"

      - name: Compile board object first
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm SUBARCH=arm CROSS_COMPILE="$TC"
          make -j2 prepare scripts
          make -j2 arch/arm/mach-k3v2/board-k3v2oem1.o V=0
          "$TC"nm -S --size-sort arch/arm/mach-k3v2/board-k3v2oem1.o | tee ../V349-BOARD-NM.txt
          "$TC"objdump -dr arch/arm/mach-k3v2/board-k3v2oem1.o > ../V349-BOARD-OBJDUMP.txt
          grep -E '[[:space:]]k3v2oem1_init$' ../V349-BOARD-NM.txt | tee ../V349-BOARD-INIT-SIZE.txt

      - name: Build V3.49 boot-parity zImage
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm SUBARCH=arm CROSS_COMPILE="$TC"
          make -j2 zImage 2>&1 | tee ../V349-BUILD.log
          cp arch/arm/boot/zImage ../HWT101-V3.49-FIX10-BOOT-PARITY-zImage
          cp vmlinux ../HWT101-V3.49-vmlinux
          cp System.map ../HWT101-V3.49-System.map
          sha256sum arch/arm/boot/zImage | tee ../V349-SHA256.txt
          ls -l arch/arm/boot/zImage | tee ../V349-SIZE.txt

      - name: Final binary topology and SWAP control audit
        shell: bash
        run: |
          set -euo pipefail
          VM=kernel/vmlinux
          MAP=kernel/System.map
          {
            echo '=== V3.49 FINAL BINARY AUDIT ==='
            echo 'Expected: boot-parity only, SWAP intentionally disabled.'
            echo '--- required OEM topology strings ---'
            for s in 'mipi_toshiba_MDW70_V001' 'sn65dsi83' 'bq2419x_charger' 'audience_es305' 'atmel_mxt224e' 'mhl_Sii9244_page0' 'mhl_Sii9244_page1' 'mhl_Sii9244_page2' 'mhl_Sii9244_cbus' 'tpa2028_r' 'ft5x0x_ts' 'Goodix-TS' 'bq_bci_battery' 'kim' 'bluesleep' 'btwilink'; do
              grep -aFq "$s" "$VM" || { echo "MISSING $s"; exit 91; }
              echo "OK $s"
            done
            NI=$(awk '$3=="sys_ni_syscall"{print $1; exit}' "$MAP")
            ON=$(awk '$3=="sys_swapon"{print $1; exit}' "$MAP")
            OFF=$(awk '$3=="sys_swapoff"{print $1; exit}' "$MAP")
            echo "sys_ni_syscall=$NI"
            echo "sys_swapon=$ON"
            echo "sys_swapoff=$OFF"
            test -n "$NI" && test "$NI" = "$ON" && test "$NI" = "$OFF"
            echo 'SWAP_CONTROL=PASS (same as OEM FIX10: ENOSYS aliases)'
          } | tee V349-FINAL-AUDIT.txt

      - name: Upload V3.49 boot-parity research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HWT101-V3.49-FIX10-BOOT-PARITY
          include-hidden-files: true
          path: |
            HWT101-V3.49-FIX10-BOOT-PARITY-zImage
            HWT101-V3.49-vmlinux
            HWT101-V3.49-System.map
            V349-CONFIG.txt
            V349-SOURCE-SHA.txt
            V349-GCC.txt
            V349-BOARD-PATCH.txt
            V349-BOARD-NM.txt
            V349-BOARD-OBJDUMP.txt
            V349-BOARD-INIT-SIZE.txt
            V349-BUILD.log
            V349-SHA256.txt
            V349-SIZE.txt
            V349-FINAL-AUDIT.txt
            kernel/arch/arm/mach-k3v2/board-k3v2oem1.c
            kernel/drivers/video/k3/sn65dsi83_hwt101.c
