name: HWT101 V4.03 RO YAFFS2 OEM Parity

on:
  workflow_dispatch:
  push:
    branches:
      - v400-oem-hinand-yaffs2-parity
    paths:
      - '.github/workflows/hwt101-v403-ro-yaffs-oem-parity.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -e
          sudo dpkg --add-architecture i386 || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y build-essential bc git libc6-i386 lib32z1 lib32stdc++6 libspreadsheet-parseexcel-perl

      - name: Reproduce exact V4.01 and add OEM YAFFS2 options
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          wf = Path('.github/workflows/hwt101-v401-readonly-guard.yml').read_text()
          marker = '      - name: Reproduce exact V4.00 and add read-only guard\n'
          p = wf.find(marker)
          if p < 0: raise SystemExit('V4.01 derivation step missing')
          r = wf.find('        run: |\n', p)
          if r < 0: raise SystemExit('V4.01 run block missing')
          r += len('        run: |\n')
          e = wf.find('\n      - name:', r)
          if e < 0: raise SystemExit('V4.01 run block end missing')
          lines=[]
          for line in wf[r:e].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          subprocess.run('\n'.join(lines)+'\n', shell=True, executable='/bin/bash', check=True)

          pth=Path('scripts/build_hwt101_v363_ntfs_prune.sh')
          s=pth.read_text()
          anchor='for x in MTD MTD_CHAR MTD_BLOCK MTD_PARTITIONS MTD_CMDLINE_PARTS MTD_NAND MTD_NAND_IDS MISC_FILESYSTEMS YAFFS_FS YAFFS_YAFFS2; do set_y "$x"; done\n'
          if anchor not in s:
              raise SystemExit('YAFFS config anchor missing')
          inject=(anchor +
                  'set_y YAFFS_DISABLE_TAGS_ECC\n' +
                  'set_y YAFFS_EMPTY_LOST_AND_FOUND\n')
          s=s.replace(anchor, inject, 1)
          pth.write_text(s)
          print('V403_DERIVATION=PASS')
          print('BASE=EXACT_V401_READONLY_GUARD')
          print('CONFIG_YAFFS_DISABLE_TAGS_ECC=y')
          print('CONFIG_YAFFS_EMPTY_LOST_AND_FOUND=y')
          print('NAND_WRITE_GUARD=PRESERVED')
          PY

      - name: Build V4.03 RO
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_hwt101_v363_ntfs_prune.sh
          cp HWT101-V3.63-FIX10-NTFS-PRUNE-zImage HWT101-V4.03-RO-YAFFS-OEM-PARITY-zImage
          cp kernel/vmlinux HWT101-V4.03-RO-YAFFS-OEM-PARITY-vmlinux
          cp kernel/System.map HWT101-V4.03-RO-YAFFS-OEM-PARITY-System.map
          sha256sum HWT101-V4.03-RO-YAFFS-OEM-PARITY-zImage | tee V403-SHA256.txt
          stat -c%s HWT101-V4.03-RO-YAFFS-OEM-PARITY-zImage | tee V403-SIZE.txt

      - name: OEM YAFFS and NAND safety audit
        shell: bash
        run: |
          set -euo pipefail
          H=kernel/drivers/mtd/nand/hinand_hwt101.c
          C=kernel/.config
          Y=kernel/fs/yaffs2/yaffs_vfs.c

          grep -qx 'CONFIG_YAFFS_FS=y' "$C"
          grep -qx 'CONFIG_YAFFS_YAFFS2=y' "$C"
          grep -qx 'CONFIG_YAFFS_DISABLE_TAGS_ECC=y' "$C"
          grep -qx 'CONFIG_YAFFS_EMPTY_LOST_AND_FOUND=y' "$C"
          grep -q 'CONFIG_YAFFS_DISABLE_TAGS_ECC' "$Y"
          grep -q 'param->no_tags_ecc = 1' "$Y"
          grep -q 'CONFIG_YAFFS_EMPTY_LOST_AND_FOUND' "$Y"
          grep -q 'param->empty_lost_n_found = 1' "$Y"

          grep -q 'HWT101_V401_RO_GUARD: BLOCK PAGEPROG' "$H"
          grep -q 'HWT101_V401_RO_GUARD: BLOCK ERASE2' "$H"
          grep -q 'h->mtd.flags &= ~MTD_WRITEABLE;' "$H"
          ! grep -q 'nfc_write(h,0x1080,NFC_CMD)' "$H"
          ! grep -q 'nfc_write(h,0x23,NFC_DMA_CTRL)' "$H"
          ! grep -q 'nfc_write(h,0xd060,NFC_CMD)' "$H"
          grep -q 'nfc_write(h,HWT_DMA_SIZE,NFC_CMD)' "$H"
          grep -q 'nfc_write(h,0x21,NFC_DMA_CTRL)' "$H"
          grep -q '.offset = 2, .length = 30' "$H"
          ! grep -q 'hwt_capture_system_raw' "$H"

          {
            echo '=== HWT101 V4.03 RO YAFFS2 OEM PARITY AUDIT ==='
            echo BUILD=PASS
            echo BASE=V4.01_READONLY_GUARD
            echo YAFFS_DISABLE_TAGS_ECC=y
            echo EXPECT_NO_TAGS_ECC=1
            echo YAFFS_EMPTY_LOST_AND_FOUND=y
            echo EXPECT_EMPTY_LOST_N_FOUND=1
            echo PAGEPROG=PHYSICALLY_BLOCKED
            echo ERASE2=PHYSICALLY_BLOCKED
            echo MTD_WRITEABLE=CLEARED
            echo OEM_OOBFREE=2..31_LEN30
            echo READSTART=PRESERVED
            echo "ZIMAGE_SIZE=$(cat V403-SIZE.txt)"
            echo "ZIMAGE_SHA256=$(cut -d' ' -f1 V403-SHA256.txt)"
          } | tee V403-FINAL-AUDIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HWT101-V4.03-RO-YAFFS-OEM-PARITY
          include-hidden-files: true
          path: |
            HWT101-V4.03-*
            V400-*.txt
            V401-*.txt
            V403-*.txt
            kernel/.config
            kernel/System.map
            kernel/fs/yaffs2/yaffs_vfs.c
            kernel/fs/yaffs2/yaffs_mtdif2.c
            kernel/drivers/mtd/nand/hinand_hwt101.c
            kernel/drivers/mtd/nand/nand_base.c
            kernel/drivers/mtd/nand/nand_ids.c
            kernel/drivers/mtd/cmdlinepart.c
          if-no-files-found: error
