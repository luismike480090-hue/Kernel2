name: HWT101 V3.42 DIAGNOSTIC TRIGGER

on:
  push:
    branches: [ main ]

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch V3.42 panic-hold diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hwt101-v342-panic-hold.yml --repo "${{ github.repository }}" --ref main
