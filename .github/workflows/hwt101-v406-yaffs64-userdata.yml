name: HWT101 V4.07A ADB ISOLATION

on:
  workflow_dispatch:
  push:
    branches:
      - v407a-adb-isolation
    paths:
      - '.github/workflows/hwt101-v406-yaffs64-userdata.yml'
      - 'scripts/patch_hwt101_v406_yaffs64_userdata.py'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -e
          sudo dpkg --add-architecture i386 || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y build-essential bc git libc6-i386 lib32z1 lib32stdc++6 libspreadsheet-parseexcel-perl

      - name: Reproduce exact V4.06 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          wf = Path('.github/workflows/hwt101-v405-android-rw-guard.yml').read_text()
          marker = '      - name: Reproduce exact V4.03 and add V4.05 Android RW guard\n'
          p = wf.find(marker)
          if p < 0: raise SystemExit('V4.05 derivation step missing')
          r = wf.find('        run: |\n', p)
          if r < 0: raise SystemExit('V4.05 run block missing')
          r += len('        run: |\n')
          e = wf.find('\n      - name:', r)
          if e < 0: raise SystemExit('V4.05 run block end missing')
          lines=[]
          for line in wf[r:e].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          subprocess.run('\n'.join(lines)+'\n', shell=True, executable='/bin/bash', check=True)

          pth=Path('scripts/build_hwt101_v363_ntfs_prune.sh')
          s=pth.read_text()
          anchor='python3 scripts/patch_hwt101_v405_android_rw_guard.py kernel | tee V405-ANDROID-RW-GUARD.txt\n'
          if anchor not in s:
              raise SystemExit('V4.05 patch invocation anchor missing')
          s=s.replace(anchor, anchor+'python3 scripts/patch_hwt101_v406_yaffs64_userdata.py kernel | tee V406-YAFFS64-USERDATA.txt\n', 1)
          pth.write_text(s)
          print('V406_DERIVATION=PASS')
          PY

      - name: Apply ONLY exact OEM kernelrelease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pth=Path('scripts/build_hwt101_v363_ntfs_prune.sh')
          s=pth.read_text()
          anchor="# Build.\npushd kernel >/dev/null\n"
          if anchor not in s:
              raise SystemExit('build anchor missing')
          block = "# V4.07A: ADB isolation.\\n# Preserve V4.06 kernel configuration exactly; only force exact OEM UTS_RELEASE.\\ncp kernel/.config V407A-config-before.txt\\npushd kernel >/dev/null\\n: > .scmversion\\nKR=\\\"$(make -s LOCALVERSION= kernelrelease | tail -n1)\\\"\\necho \\\"V407A_KERNELRELEASE=$KR\\\"\\ntest \\\"$KR\\\" = '3.0.8-g883717a-dirty'\\npopd >/dev/null\\n"
          s=s.replace(anchor, block+anchor, 1)
          if "make -j2 zImage" not in s:
              raise SystemExit('zImage build command missing')
          s=s.replace("make -j2 zImage", "make LOCALVERSION= -j2 zImage", 1)
          pth.write_text(s)
          print('V407A_PATCH=PASS')
          print('CHANGE=EXACT_KERNELRELEASE_ONLY')
          PY

      - name: Build V4.07A
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_hwt101_v363_ntfs_prune.sh
          cp HWT101-V3.63-FIX10-NTFS-PRUNE-zImage HWT101-V4.07A-ADB-ISOLATION-zImage
          cp kernel/vmlinux HWT101-V4.07A-ADB-ISOLATION-vmlinux
          cp kernel/System.map HWT101-V4.07A-ADB-ISOLATION-System.map
          cp kernel/.config V407A-kernel-config.txt
          sha256sum HWT101-V4.07A-ADB-ISOLATION-zImage | tee V407A-SHA256.txt
          stat -c%s HWT101-V4.07A-ADB-ISOLATION-zImage | tee V407A-SIZE.txt
          make -s -C kernel ARCH=arm CROSS_COMPILE="$PWD/gcc46/bin/arm-eabi-" LOCALVERSION= kernelrelease | tail -n1 | tee V407A-KERNELRELEASE.txt

      - name: V4.07A hard isolation audit
        shell: bash
        run: |
          set -euo pipefail
          C=kernel/.config
          H=kernel/drivers/mtd/nand/hinand_hwt101.c
          P=kernel/drivers/mtd/cmdlinepart.c
          Y1=kernel/fs/yaffs2/yaffs_mtdif.c
          Y2=kernel/fs/yaffs2/yaffs_mtdif2.c

          grep -qx '3.0.8-g883717a-dirty' V407A-KERNELRELEASE.txt
          ! grep -q 'dirty+' V407A-KERNELRELEASE.txt

          # These MUST remain exactly as V4.06 working C3R3 kernel.
          grep -qx 'CONFIG_BT=y' "$C"
          grep -qx 'CONFIG_CFG80211=y' "$C"
          grep -qx '# CONFIG_MAC80211 is not set' "$C"
          grep -qx '# CONFIG_TI_ST is not set' "$C"
          ! grep -q '^CONFIG_WIRELESS_EXT=y$' "$C"

          sha256sum "$C" | tee V407A-CONFIG-SHA256.txt
          grep -qx '24c2fc8559a6f3676039925b1a1d66c20ad47a00fbab5485cabb339284f423b3  kernel/.config' V407A-CONFIG-SHA256.txt

          # Preserve V4.05/V4.06 storage work.
          grep -q '#define HWT_ANDROID_FIRST_PAGE 0x16500U' "$H"
          grep -q '#define HWT_ANDROID_LAST_PAGE  0xfffffU' "$H"
          grep -q 'HWT101_V405_ANDROID_GUARD: ALLOW PAGEPROG' "$H"
          grep -q 'HWT101_V405_ANDROID_GUARD: ALLOW ERASE2' "$H"
          grep -q 'unsigned long long' "$P"
          grep -q '~0ULL' "$P"
          grep -q 'loff_t addr =' "$Y1"
          ! grep -q 'u32 addr =' "$Y1"
          test "$(grep -c '((loff_t) block_no) \* dev->param.chunks_per_block \*' "$Y2")" -ge 2

          {
            echo '=== HWT101 V4.07A ADB ISOLATION AUDIT ==='
            echo BUILD=PASS
            echo BASE=V4.06_YAFFS64
            echo CHANGE=EXACT_KERNELRELEASE_ONLY
            echo CONFIG_IDENTICAL_TO_V406=YES
            echo KERNELRELEASE=3.0.8-g883717a-dirty
            echo TRAILING_PLUS=NO
            echo BT_BUILTIN=YES_V406
            echo CFG80211_BUILTIN=YES_V406
            echo MAC80211_BUILTIN=NO_V406
            echo TI_ST_BUILTIN=NO_V406
            echo WIRELESS_EXT_BUILTIN=NO_V406
            echo V405_WRITE_GUARD=PRESERVED
            echo V406_YAFFS64=PRESERVED
            echo "ZIMAGE_SIZE=$(cat V407A-SIZE.txt)"
            echo "ZIMAGE_SHA256=$(cut -d' ' -f1 V407A-SHA256.txt)"
          } | tee V407A-FINAL-AUDIT.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HWT101-V4.07A-ADB-ISOLATION
          include-hidden-files: true
          path: |
            HWT101-V4.07A-*
            V407A-*.txt
            V400-*.txt
            V401-*.txt
            V405-*.txt
            V406-*.txt
            kernel/.config
            kernel/System.map
            kernel/fs/yaffs2/yaffs_mtdif.c
            kernel/fs/yaffs2/yaffs_mtdif2.c
            kernel/drivers/mtd/nand/hinand_hwt101.c
            kernel/drivers/mtd/cmdlinepart.c
          if-no-files-found: error
